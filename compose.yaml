# Development only. These credentials are public dummy values for this local DB.
name: portfolio-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev
      POSTGRES_DB: portfolio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Relative to this file: on this laptop, the data is stored under /home.
      - ./.local/postgres:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 3s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
